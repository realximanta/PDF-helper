name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Verify tag matches versionName
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "Tag version:    $TAG_VERSION"
          echo "Gradle version: $VERSION_NAME"
          if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match versionName ($VERSION_NAME). Bump versionName in app/build.gradle.kts."
            exit 1
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "pdf-helper-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pdf-helper-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          overwrite_files: true

      - name: Commit latest.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          mkdir -p data
          cat > data/latest.json <<EOF
          {
            "version": "${GITHUB_REF_NAME}",
            "tag": "${GITHUB_REF_NAME}",
            "apk_url": "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/pdf-helper-${GITHUB_REF_NAME}.apk",
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "release_notes_url": "https://github.com/${{ github.repository }}/releases/tag/${GITHUB_REF_NAME}"
          }
          EOF

          git add data/latest.json
          if git diff --staged --quiet; then
            echo "No changes to latest.json"
          else
            git commit -m "chore(release): update latest.json for ${GITHUB_REF_NAME}"
            git push origin main
          fi
