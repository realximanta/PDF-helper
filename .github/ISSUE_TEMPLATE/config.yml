# Configures the "New issue" chooser.
# Without this file, GitHub appends a "blank issue" option alongside every
# template — which lets users bypass the structured forms.

blank_issues_enabled: false

contact_links:
  - name: Security vulnerability
    url: https://github.com/realximanta/PDF-helper/security/advisories/new
    about: Please report security issues privately via GitHub Security Advisories, not as a public issue.

  - name: Question or discussion
    url: https://github.com/realximanta/PDF-helper/discussions
    about: Ask a question, share a workflow, or discuss ideas before opening a feature request.

  - name: Telegram
    url: https://t.me/b4nzw
    about: Direct message the maintainer for anything urgent or off-topic.
